name: Bug Report
description: Report a problem with one of the Plesk scripts
labels: ["bug"]
body:
  - type: dropdown
    id: script
    attributes:
      label: Affected script
      options:
        - mysql-backups (mysql-backup.sh / mysql-backup.bat)
        - remove-old-wordpress-backups (remove-wordpress-backups.sh)
        - pci-dss-scan (pci-dss-scan.sh / pci-dss-scan.bat)
        - essential-plugin-malware-scan (essential-plugin-scan.sh)
        - monitor-domain-hosting (monitor-aspnet.bat)
        - Other / not sure
    validations:
      required: true
  - type: input
    attributes:
      label: Platform and Plesk version
      description: e.g. "Ubuntu 22.04, Plesk Obsidian 18.0.60" or "Windows Server 2022, Plesk Obsidian 18.0.60"
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the exact command you ran and the full output/error.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
