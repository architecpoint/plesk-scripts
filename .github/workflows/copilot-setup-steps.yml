name: Copilot Setup Steps

# This workflow lets Copilot's cloud coding agent pre-install tooling before
# starting a task. See https://docs.github.com/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
