name: Docs

on:
  pull_request:
    paths:
      - '**.md'
      - '**.sh'
      - '**.bat'
      - '.github/scripts/check-docs.sh'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.sh'
      - '**.bat'
      - '.github/scripts/check-docs.sh'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: Docs match scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Check links, folder READMEs and documented env vars
        run: .github/scripts/check-docs.sh
