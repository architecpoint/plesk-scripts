name: Release PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/skills/**'
      - '.github/agents/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Prepare release branch
        id: prep
        run: |
          set -euo pipefail
          if ! awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f && /^- /{found=1} END{exit !found}' CHANGELOG.md; then
            echo "No entries under [Unreleased]; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$(date -u +%Y.%m.%d)"
          n=1
          candidate="${tag}"
          while git rev-parse -q --verify "refs/tags/${candidate}" >/dev/null; do
            n=$((n + 1))
            candidate="${tag}-${n}"
          done
          tag="${candidate}"

          awk -v tag="${tag}" '
            /^## \[Unreleased\]/ && !done { print; print ""; print "## " tag; done=1; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add CHANGELOG.md
          git commit -m "chore(release): ${tag}"
          git push --force origin release/next

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: steps.prep.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          set -euo pipefail
          body="Merging this PR publishes release \`${TAG}\`: the release workflow tags the merge commit and attaches \`SHA256SUMS\`, which server self-updates verify against."
          existing=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "Release ${TAG}" --body "${body}"
          else
            gh pr create --head release/next --base main --title "Release ${TAG}" --body "${body}"
          fi
